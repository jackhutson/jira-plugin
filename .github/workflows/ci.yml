name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.216

jobs:
  plugin-validation:
    name: Plugin and JSON validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate plugin, JSON, syntax, and release metadata
        run: bash scripts/validate.sh plugin

  shell-and-hooks:
    name: Shell and SessionStart fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Bash syntax, ShellCheck, and every hook branch
        run: bash scripts/validate.sh shell

  behavior:
    name: Offline behavior and eval contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run storage, workflow, safety, JSON, and eval-runner tests
        run: bash scripts/validate.sh behavior

  acli-command-contract:
    name: ACLI command contract (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: minimum
            expected-version: 1.3.15-stable
          - target: latest
            expected-version: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the ${{ matrix.target }} ACLI binary
        run: bash scripts/install-acli-test-binary.sh "${{ matrix.target }}" /tmp/jira-plugin-acli
      - name: Compare curated commands with live help
        env:
          ACLI_BIN: /tmp/jira-plugin-acli
          ACLI_EXPECTED_VERSION: ${{ matrix.expected-version }}
        run: bash scripts/validate.sh contract
